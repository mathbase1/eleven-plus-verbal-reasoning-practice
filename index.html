
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11+ Verbal Reasoning Practice Quest</title>
  <style>
    :root {
      --ink: #17314f;
      --muted: #5a6c82;
      --panel: #ffffff;
      --soft: #f2f7ff;
      --accent: #6f42c1;
      --accent-2: #ffb703;
      --good: #16803a;
      --bad: #c83232;
      --line: #d8e4f5;
      --shadow: 0 16px 40px rgba(23, 49, 79, 0.14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(111,66,193,.14), transparent 34rem),
        radial-gradient(circle at 86% 8%, rgba(255,183,3,.18), transparent 28rem),
        linear-gradient(180deg, #fbf9ff 0%, #eef6ff 100%);
      min-height: 100vh;
    }

    .app {
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(216, 228, 245, .9);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.05rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.45;
    }

    .mascot {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f2e7ff, #fff1bd);
      font-size: 3rem;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.75);
    }

    .toolbar {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .pill, select, button {
      font: inherit;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: 0 6px 18px rgba(23,49,79,.08);
      color: var(--muted);
    }

    select {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
    }

    .screen { margin-top: 22px; }
    .hidden { display: none !important; }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
      gap: 16px;
    }

    .topic-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 19px;
      box-shadow: 0 10px 26px rgba(23,49,79,.10);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      min-height: 174px;
      display: grid;
      align-content: space-between;
      gap: 14px;
    }

    .topic-card:hover, .topic-card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: rgba(111,66,193,.45);
      outline: none;
    }

    .topic-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 1.55rem;
      margin-bottom: 10px;
    }

    .topic-card h2 {
      margin: 0 0 7px;
      font-size: 1.2rem;
    }

    .topic-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
      font-size: .96rem;
    }

    .mini-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .9rem;
    }

    .level-dots {
      display: inline-flex;
      gap: 4px;
      vertical-align: middle;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d3deef;
      display: inline-block;
    }

    .dot.on { background: var(--accent); }

    .quiz-shell { display: grid; gap: 16px; }

    .quiz-top, .question-panel, .feedback-panel, .results-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .quiz-top {
      padding: 17px;
      display: grid;
      gap: 12px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quiz-title {
      font-size: 1.22rem;
      font-weight: 900;
    }

    .score-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
    }

    .meter {
      width: 100%;
      height: 14px;
      background: #e7effb;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #d8e4f5;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #b18cff);
      transition: width .25s ease;
    }

    .question-panel { padding: clamp(18px, 3vw, 28px); }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tag {
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--soft);
      color: var(--muted);
      font-size: .92rem;
      border: 1px solid var(--line);
    }

    .question-text {
      font-size: clamp(1.17rem, 2vw, 1.45rem);
      line-height: 1.42;
      font-weight: 900;
      margin: 0 0 12px;
    }

    .stimulus-wrap {
      display: grid;
      gap: 8px;
      margin: 8px 0 10px;
    }

    .stimulus-wrap:empty { display: none; }

    .vr-card, .diagram, .code-table, .sequence-strip, .word-bank, .match-card, .select-area {
      max-width: min(100%, 560px);
      margin: 0 auto;
      background: #fbfdff;
      border: 1px solid #dfe9f7;
      border-radius: 16px;
      padding: 12px;
    }

    .diagram svg {
      display: block;
      max-width: 100%;
      max-height: 220px;
      margin: 0 auto;
    }

    .code-table table, .review-table, .match-card table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    .code-table th, .code-table td, .match-card th, .match-card td, .review-table th, .review-table td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .code-table th, .match-card th, .review-table th { background: var(--soft); }

    .sequence-strip, .word-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 1.15rem;
      font-weight: 900;
    }

    .seq-token, .word-token {
      border: 1px solid #cbdcf2;
      background: white;
      border-radius: 12px;
      padding: 9px 12px;
      min-width: 42px;
      text-align: center;
    }

    .choices, .multi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 17px;
      background: var(--accent);
      color: white;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 9px 18px rgba(111,66,193,.22);
    }

    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      outline: none;
      box-shadow: 0 13px 24px rgba(111,66,193,.26);
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .choice-btn, .tile-btn, .multi-btn {
      background: #fff;
      color: var(--ink);
      text-align: left;
      border: 2px solid var(--line);
      box-shadow: 0 7px 18px rgba(23,49,79,.08);
      min-height: 56px;
    }

    .choice-btn.correct, .multi-btn.correct, .tile-btn.correct {
      border-color: rgba(22,128,58,.85);
      background: #edf9f0;
    }

    .choice-btn.wrong, .multi-btn.wrong, .tile-btn.wrong {
      border-color: rgba(200,50,50,.85);
      background: #fff0f0;
    }

    .multi-btn.selected, .tile-btn.selected {
      border-color: rgba(111,66,193,.75);
      background: #f3ecff;
    }

    .order-board {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .tile-row, .answer-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      min-height: 54px;
    }

    .answer-row {
      border: 2px dashed #cbdcf2;
      border-radius: 16px;
      padding: 10px;
      background: #fbfdff;
    }

    .answer-slot {
      min-width: 46px;
      min-height: 42px;
      border-radius: 12px;
      border: 1px solid #cbdcf2;
      display: grid;
      place-items: center;
      background: white;
      font-weight: 900;
    }

    .tile-btn { min-width: 52px; text-align: center; }

    .match-card select {
      width: 100%;
      border-radius: 12px;
      padding: 8px 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .secondary {
      background: #eef4ff;
      color: var(--ink);
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .gold {
      background: var(--accent-2);
      color: #412b00;
      box-shadow: 0 9px 18px rgba(255,183,3,.22);
    }

    .feedback-panel {
      padding: 18px 20px;
      line-height: 1.5;
    }

    .feedback-panel.good { border-color: rgba(22,128,58,.55); background: #f2fff5; }
    .feedback-panel.bad { border-color: rgba(200,50,50,.55); background: #fff6f6; }
    .feedback-panel.hint { border-color: rgba(255,183,3,.55); background: #fffaf0; }

    .feedback-panel strong { display: block; margin-bottom: 4px; }
    .feedback-panel span { display: block; margin-top: 4px; }
    .small-note { margin-top: 6px; text-align: center; color: var(--muted); font-size: .92rem; }

    .results-panel {
      padding: clamp(22px, 4vw, 36px);
      text-align: center;
    }

    .big-score {
      font-size: clamp(2.2rem, 6vw, 4.3rem);
      font-weight: 900;
      letter-spacing: -.05em;
      margin: 10px 0;
    }

    .review-wrap {
      overflow-x: auto;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: left;
    }

    @media (max-width: 680px) {
      header.hero { grid-template-columns: 1fr; }
      .mascot { width: 82px; height: 82px; font-size: 2.4rem; }
      .app { width: min(100% - 18px, 1160px); padding-top: 12px; }
      .choices, .multi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>11+ Verbal Reasoning Practice Quest</h1>
        <p class="subtitle">UK 11+ verbal reasoning practice for GL, CEM and independent-school style preparation: vocabulary, codes, analogies, sequences, word logic and deduction.</p>
      </div>
      <div class="mascot" aria-hidden="true">🧩</div>
    </header>

    <section class="toolbar" id="homeToolbar">
      <div class="pill" id="bankSummary">Question bank loading…</div>
      <label class="pill">Questions per round
        <select id="sessionLength" aria-label="Questions per round">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
      </label>
      <button class="secondary" id="resetProgressBtn" type="button">Reset progress</button>
    </section>

    <section class="screen" id="homeScreen">
      <div class="topic-grid" id="topicGrid"></div>
    </section>

    <section class="screen hidden" id="quizScreen">
      <div class="quiz-shell">
        <div class="quiz-top">
          <div class="top-row">
            <div class="quiz-title" id="quizTitle">Topic</div>
            <div class="score-strip">
              <span id="scoreText">Score 0</span>
              <span id="questionCountText">Question 1</span>
              <span id="levelText">Level 2</span>
            </div>
          </div>
          <div class="meter" aria-label="Round progress"><div class="meter-fill" id="progressFill"></div></div>
        </div>

        <article class="question-panel" id="questionPanel">
          <div class="tag-row" id="tagRow"></div>
          <p class="question-text" id="questionText"></p>
          <div class="stimulus-wrap" id="stimulusWrap"></div>
          <div id="interactionWrap"></div>
          <div class="actions">
            <button class="gold" id="hintBtn" type="button">Show hint</button>
            <button id="checkBtn" type="button" class="hidden">Check answer</button>
            <button class="secondary hidden" id="nextBtn" type="button">Next question</button>
            <button class="secondary" id="backBtn" type="button">Choose topic</button>
          </div>
        </article>

        <div class="feedback-panel hidden" id="feedbackPanel" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="screen hidden" id="resultsScreen">
      <div class="results-panel">
        <h2>Round complete!</h2>
        <div class="big-score" id="finalScore">0/0</div>
        <p id="finalMessage"></p>
        <div class="actions" style="justify-content:center">
          <button id="playAgainBtn" type="button">Play this topic again</button>
          <button class="secondary" id="homeBtn" type="button">Choose another topic</button>
        </div>
        <div class="review-wrap" id="reviewWrap"></div>
      </div>
    </section>
  </main>

  <script>
    const TOPICS = {
      vocab: { name: "Vocabulary & Word Meanings", icon: "📚", blurb: "Synonyms, antonyms, homophones, word meanings, prefixes and precise vocabulary." },
      analogies: { name: "Analogies & Relationships", icon: "🔗", blurb: "Word pairs, part-whole links, opposites, functions, categories and relationships." },
      classification: { name: "Odd One Out & Categories", icon: "🧠", blurb: "Find the word that does not belong, choose matching groups, and spot shared features." },
      compounds: { name: "Compound Words & Word Pairs", icon: "🧱", blurb: "Build compound words, find shared words, and match word halves." },
      codes: { name: "Letter Codes", icon: "🔐", blurb: "Alphabet positions, shifting letters, reverse alphabet, coded words and code tables." },
      sequences: { name: "Letter & Number Sequences", icon: "➡️", blurb: "Alphabet patterns, alternating sequences, word order, numbered letters and missing terms." },
      wordplay: { name: "Hidden Words & Anagrams", icon: "🔎", blurb: "Anagrams, hidden words, letter removal, alphabet order and word construction." },
      logic: { name: "Logic & Deduction", icon: "♟️", blurb: "Ordering clues, statements, matching puzzles, following instructions and conclusions." },
      mixed: { name: "Mixed Practice", icon: "⭐", blurb: "A shuffled round across the full 11+ verbal reasoning practice bank." }
    };

    const ACTIVE_TOPICS = Object.keys(TOPICS).filter(t => t !== "mixed");
    const BANK = [];
    let familyCounter = 0;

    const els = {
      bankSummary: document.getElementById("bankSummary"),
      topicGrid: document.getElementById("topicGrid"),
      homeScreen: document.getElementById("homeScreen"),
      quizScreen: document.getElementById("quizScreen"),
      resultsScreen: document.getElementById("resultsScreen"),
      homeToolbar: document.getElementById("homeToolbar"),
      sessionLength: document.getElementById("sessionLength"),
      resetProgressBtn: document.getElementById("resetProgressBtn"),
      quizTitle: document.getElementById("quizTitle"),
      scoreText: document.getElementById("scoreText"),
      questionCountText: document.getElementById("questionCountText"),
      levelText: document.getElementById("levelText"),
      progressFill: document.getElementById("progressFill"),
      tagRow: document.getElementById("tagRow"),
      questionText: document.getElementById("questionText"),
      stimulusWrap: document.getElementById("stimulusWrap"),
      interactionWrap: document.getElementById("interactionWrap"),
      hintBtn: document.getElementById("hintBtn"),
      checkBtn: document.getElementById("checkBtn"),
      nextBtn: document.getElementById("nextBtn"),
      backBtn: document.getElementById("backBtn"),
      feedbackPanel: document.getElementById("feedbackPanel"),
      finalScore: document.getElementById("finalScore"),
      finalMessage: document.getElementById("finalMessage"),
      playAgainBtn: document.getElementById("playAgainBtn"),
      homeBtn: document.getElementById("homeBtn"),
      reviewWrap: document.getElementById("reviewWrap")
    };

    const defaultProgress = () => {
      const topics = {};
      ACTIVE_TOPICS.forEach(id => topics[id] = { level: 2, total: 0, correct: 0, streak: 0, bestStreak: 0 });
      return { topics, lifetime: { total: 0, correct: 0 } };
    };

    let progress = loadProgress();
    let state = {
      topic: null,
      currentQuestion: null,
      currentEntry: null,
      used: new Set(),
      index: 0,
      length: 15,
      score: 0,
      answered: false,
      history: [],
      multiSelected: new Set(),
      orderSelected: []
    };

    function loadProgress() {
      try {
        const raw = localStorage.getItem("elevenPlusVRProgressV1");
        const parsed = raw ? JSON.parse(raw) : defaultProgress();
        const base = defaultProgress();
        ACTIVE_TOPICS.forEach(id => parsed.topics[id] = Object.assign(base.topics[id], parsed.topics[id] || {}));
        parsed.lifetime = Object.assign(base.lifetime, parsed.lifetime || {});
        return parsed;
      } catch (e) {
        return defaultProgress();
      }
    }

    function saveProgress() { localStorage.setItem("elevenPlusVRProgressV1", JSON.stringify(progress)); }
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    function rint(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function pick(arr) { return arr[rint(0, arr.length - 1)]; }
    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = rint(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])); }
    function tidy(s) { return String(s).trim().toLowerCase().replace(/\s+/g, " "); }
    function key(s) { return tidy(s).replace(/[.,;:!?()]/g, ""); }
    function unique(arr, keyFn = x => String(x).toLowerCase()) {
      const seen = new Set();
      const out = [];
      arr.forEach(x => { const k = keyFn(x); if (!seen.has(k)) { seen.add(k); out.push(x); } });
      return out;
    }
    function fmtAnswer(v) {
      if (Array.isArray(v)) return v.join(" → ");
      if (v && typeof v === "object") return Object.entries(v).map(([a,b]) => `${a} → ${b}`).join("; ");
      return String(v);
    }
    function makeTextChoices(answer, distractors, min = 4) {
      const fillers = ["cannot tell", "none of these", "both are possible", "all of these", "same meaning", "opposite meaning"];
      const items = unique([answer].concat(distractors || []), key);
      let guard = 0;
      while (items.length < min && guard < fillers.length) {
        if (key(fillers[guard]) !== key(answer)) items.push(fillers[guard]);
        guard += 1;
      }
      return shuffle(unique(items, key).slice(0, Math.max(min, 4))).map(v => ({ value: v, label: String(v) }));
    }
    function makeLetterChoices(answer) {
      const letters = [answer];
      const p = pos(answer);
      [-3,-2,-1,1,2,3,4,5].forEach(n => letters.push(letter(p+n)));
      return shuffle(unique(letters).slice(0, 4)).map(v => ({ value: v, label: v }));
    }
    function topicLevel(topic) { return progress.topics[topic]?.level || 2; }
    function averageLevel() { return Math.round(ACTIVE_TOPICS.reduce((s,t)=>s+topicLevel(t),0) / ACTIVE_TOPICS.length); }
    function dotLevel(level) {
      return `<span class="level-dots" aria-label="Level ${level} out of 5">${[1,2,3,4,5].map(n => `<span class="dot ${n <= level ? "on" : ""}"></span>`).join("")}</span>`;
    }
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    function pos(ch) { return ALPHABET.indexOf(String(ch).toUpperCase()) + 1; }
    function letter(n) { return ALPHABET[((n - 1) % 26 + 26) % 26]; }
    function shiftWord(word, n) { return String(word).toUpperCase().split("").map(ch => /[A-Z]/.test(ch) ? letter(pos(ch) + n) : ch).join(""); }
    function reverseAlpha(ch) { return letter(27 - pos(ch)); }
    function reverseWord(word) { return String(word).toUpperCase().split("").map(reverseAlpha).join(""); }
    function alphaSum(word) { return String(word).toUpperCase().split("").reduce((s,ch)=>s+pos(ch),0); }
    function svgAlphabet(highlights = []) {
      const w = 650, h = 110, cell = 24, startX = 16, y = 38;
      const hs = new Set(highlights.map(x => String(x).toUpperCase()));
      let html = `<div class="diagram"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Alphabet strip">`;
      for (let i = 0; i < 26; i++) {
        const x = startX + i * cell;
        const ch = ALPHABET[i];
        html += `<rect x="${x}" y="${y}" width="22" height="28" rx="5" fill="${hs.has(ch) ? "#efe2ff" : "#ffffff"}" stroke="#16324f" stroke-width="1.2"/>`;
        html += `<text x="${x+11}" y="${y+19}" text-anchor="middle" font-family="Trebuchet MS, Arial" font-size="13" font-weight="900" fill="#17314f">${ch}</text>`;
        html += `<text x="${x+11}" y="${y+45}" text-anchor="middle" font-family="Trebuchet MS, Arial" font-size="10" font-weight="700" fill="#5a6c82">${i+1}</text>`;
      }
      html += `</svg></div>`;
      return html;
    }
    function codeTable(headers, rows) {
      return `<div class="code-table"><table><thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    function wordBank(words) { return `<div class="word-bank">${words.map(w => `<span class="word-token">${escapeHtml(w)}</span>`).join("")}</div>`; }
    function sequenceStrip(items) { return `<div class="sequence-strip">${items.map(w => `<span class="seq-token">${escapeHtml(w)}</span>`).join("<span>→</span>")}</div>`; }
    function qBase(topic, title, diff, kind, prompt, answer, opts = {}) {

        });
      }, 10);

      addFamily("logic", "Final select true statements", d => {
        const rows = shuffle([["Asha", "red", "cat"], ["Ben", "blue", "dog"], ["Cara", "green", "rabbit"], ["Dylan", "yellow", "fish"], ["Eva", "purple", "bird"]]).slice(0, 4);
        const trueStatements = [`${rows[0][0]} chose ${rows[0][1]}.`, `${rows[1][0]} has a ${rows[1][2]}.`];
        const falseStatements = [`${rows[2][0]} chose ${rows[0][1]}.`, `${rows[3][0]} has a ${rows[1][2]}.`, `${rows[0][0]} has a ${rows[3][2]}.`];
        return qBase("logic", "Final select true statements", d, "multi", "Select the two statements that are true according to the table.", trueStatements, {
          stimulus: codeTable(["Pupil", "Colour", "Pet"], rows.map(r => [r[0], r[1], r[2]])),
          choices: shuffle(trueStatements.concat(falseStatements)).map(v => ({ value: v, label: v })),
          selectCount: 2,
          hint: "Check each statement carefully against the exact row in the table.",
          explanation: `The true statements are: ${trueStatements.join(" and ")}`
        });
      }, 10);

      addFamily("logic", "Final instruction following", d => {
        const start = letter(rint(4, 20));
        const steps = [rint(1, 3+d), -rint(1, 3), rint(1, 2+d)];
        const answer = letter(pos(start) + steps.reduce((a,b) => a + b, 0));
        return qBase("logic", "Final instruction following", d, "mc", `Start at ${start}. Move forward ${steps[0]}, back ${Math.abs(steps[1])}, then forward ${steps[2]}. Where do you finish?`, answer, {
          stimulus: svgAlphabet([start, answer]),
          choices: makeLetterChoices(answer),
          hint: "Use alphabet positions and apply each instruction in order.",
          explanation: `Starting at ${start}, the net move is ${steps.reduce((a,b)=>a+b,0)}, so the finish letter is ${answer}.`
        });
      }, 10);

      addFamily("logic", "Final age comparison", d => {
        const names = shuffle(["Asha", "Ben", "Cara", "Dylan", "Eva"]).slice(0, 3);
        const order = shuffle(names);
        const answer = order[0];
        return qBase("logic", "Final age comparison", d, "mc", `${order[0]} is older than ${order[1]}. ${order[1]} is older than ${order[2]}. Who is the oldest?`, answer, {
          choices: mk(answer, names.filter(n => n !== answer).concat(["cannot tell"])),
          hint: "Put the people in order from oldest to youngest using the clues.",
          explanation: `The order is ${order[0]}, then ${order[1]}, then ${order[2]}, so ${answer} is oldest.`
        });
      }, 10);

      addFamily("logic", "Final coded conclusion", d => {
        const rules = [
          ["All robins are birds. All birds have wings.", "Robins have wings.", "yes"],
          ["All squares are rectangles. Some rectangles are blue.", "All squares are blue.", "cannot tell"],
          ["No cats are fish. Milo is a cat.", "Milo is a fish.", "no"],
          ["All roses are flowers. Some flowers are red.", "All roses are red.", "cannot tell"],
          ["Every member of the chess club is in Year 6. Priya is in the chess club.", "Priya is in Year 6.", "yes"]
        ].slice(0, 3 + d);
        const item = pick(rules);
        return qBase("logic", "Final coded conclusion", d, "mc", `${item[0]} Can we be certain that: '${item[1]}'?`, item[2], {
          choices: ["yes", "no", "cannot tell", "only sometimes"].map(v => ({ value: v, label: v })),
          hint: "Use only the information given. Do not add extra facts.",
          explanation: `The correct conclusion is '${item[2]}' because the statement must follow from the clues, not from a guess.`
        });
      }, 10);
    }

    function renderHome() {
      els.homeToolbar.classList.remove("hidden");
      els.homeScreen.classList.remove("hidden");
      els.quizScreen.classList.add("hidden");
      els.resultsScreen.classList.add("hidden");
      els.topicGrid.innerHTML = Object.entries(TOPICS).map(([id,t]) => {
        const level = id === "mixed" ? averageLevel() : topicLevel(id);
        const p = id === "mixed" ? progress.lifetime : progress.topics[id];
        const pct = p.total ? Math.round(100 * p.correct / p.total) : 0;
        return `<button class="topic-card" data-topic="${id}" type="button">
          <div><div class="topic-icon">${t.icon}</div><h2>${escapeHtml(t.name)}</h2><p>${escapeHtml(t.blurb)}</p></div>
          <div class="mini-stats"><span>${dotLevel(level)}</span><span>${p.total ? `${pct}% correct` : "new topic"}</span></div>
        </button>`;
      }).join("");
      els.topicGrid.querySelectorAll(".topic-card").forEach(btn => btn.addEventListener("click", () => startRound(btn.dataset.topic)));
    }

    function startRound(topic) {
      state.topic = topic;
      state.used = new Set();
      state.index = 0;
      state.length = Number(els.sessionLength.value || 15);
      state.score = 0;
      state.answered = false;
      state.history = [];
      els.homeToolbar.classList.add("hidden");
      els.homeScreen.classList.add("hidden");
      els.resultsScreen.classList.add("hidden");
      els.quizScreen.classList.remove("hidden");
      nextQuestion();
    }

    function pickEntry() {
      const chosenTopics = state.topic === "mixed" ? ACTIVE_TOPICS : [state.topic];
      const baseLevel = state.topic === "mixed" ? averageLevel() : topicLevel(state.topic);
      let pool = BANK.filter(e => chosenTopics.includes(e.topic) && Math.abs(e.difficulty - baseLevel) <= 1 && !state.used.has(e.id));
      if (!pool.length) pool = BANK.filter(e => chosenTopics.includes(e.topic) && !state.used.has(e.id));
      if (!pool.length) { state.used.clear(); pool = BANK.filter(e => chosenTopics.includes(e.topic)); }
      const entry = pick(pool);
      state.used.add(entry.id);
      return entry;
    }

    function nextQuestion() {
      if (state.index >= state.length) return showResults();
      state.currentEntry = pickEntry();
      const level = state.topic === "mixed" ? topicLevel(state.currentEntry.topic) : topicLevel(state.topic);
      const diff = clamp(Math.round((state.currentEntry.difficulty + level) / 2), 1, 5);
      state.currentQuestion = state.currentEntry.gen(diff);
      state.answered = false;
      state.multiSelected = new Set();
      state.orderSelected = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = state.currentQuestion;
      const topicName = TOPICS[q.topic].name;
      els.quizTitle.textContent = state.topic === "mixed" ? "Mixed Practice" : topicName;
      els.scoreText.textContent = `Score ${state.score}`;
      els.questionCountText.textContent = `Question ${state.index + 1} of ${state.length}`;
      els.levelText.textContent = `Level ${topicLevel(q.topic)}`;
      els.progressFill.style.width = `${(state.index / state.length) * 100}%`;
      els.tagRow.innerHTML = `<span class="tag">${escapeHtml(topicName)}</span><span class="tag">${escapeHtml(q.title)}</span><span class="tag">Difficulty ${q.difficulty}/5</span>`;
      els.questionText.innerHTML = escapeHtml(q.prompt);
      els.stimulusWrap.innerHTML = q.stimulus || "";
      els.feedbackPanel.className = "feedback-panel hidden";
      els.feedbackPanel.innerHTML = "";
      els.nextBtn.classList.add("hidden");
      els.checkBtn.classList.add("hidden");
      els.hintBtn.disabled = false;
      els.interactionWrap.innerHTML = "";
      if (q.kind === "mc") renderMC(q);
      if (q.kind === "multi") renderMulti(q);
      if (q.kind === "order") renderOrder(q);
      if (q.kind === "match") renderMatch(q);
    }

    function renderMC(q) {
      const wrap = document.createElement("div");
      wrap.className = "choices";
      q.choices.forEach((choice, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.dataset.value = choice.value;
        btn.innerHTML = `<strong>${String.fromCharCode(65+i)}.</strong> ${escapeHtml(choice.label)}`;
        btn.addEventListener("click", () => submitAnswer(choice.value));
        wrap.appendChild(btn);
      });
      els.interactionWrap.appendChild(wrap);
    }

    function renderMulti(q) {
      const note = document.createElement("div");
      note.className = "pill";
      note.style.display = "inline-block";
      note.textContent = `Select ${q.selectCount || q.answer.length} answer${(q.selectCount || q.answer.length) === 1 ? "" : "s"}.`;
      const grid = document.createElement("div");
      grid.className = "multi-grid";
      q.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "multi-btn";
        btn.dataset.value = choice.value;
        btn.textContent = choice.label;
        btn.addEventListener("click", () => {
          if (state.answered) return;
          const val = choice.value;
          if (state.multiSelected.has(val)) {
            state.multiSelected.delete(val);
            btn.classList.remove("selected");
          } else {
            const limit = q.selectCount || q.answer.length;
            if (state.multiSelected.size >= limit) return;
            state.multiSelected.add(val);
            btn.classList.add("selected");
          }
        });
        grid.appendChild(btn);
      });
      els.interactionWrap.appendChild(note);
      els.interactionWrap.appendChild(grid);
      els.checkBtn.classList.remove("hidden");
      els.checkBtn.onclick = () => submitAnswer(Array.from(state.multiSelected));
    }

    function renderOrder(q) {
      const board = document.createElement("div");
      board.className = "order-board";
      const answerRow = document.createElement("div");
      answerRow.className = "answer-row";
      answerRow.setAttribute("aria-label", "Selected answer order");
      const tileRow = document.createElement("div");
      tileRow.className = "tile-row";
      const tiles = q.tiles.map((label, idx) => ({ label, idx }));
      function refreshAnswer() {
        answerRow.innerHTML = "";
        for (let i = 0; i < q.answer.length; i++) {
          const slot = document.createElement("button");
          slot.type = "button";
          slot.className = "answer-slot";
          const selected = state.orderSelected[i];
          slot.textContent = selected ? selected.label : "";
          slot.title = selected ? "Click to remove" : "Empty slot";
          slot.disabled = !selected || state.answered;
          if (selected) slot.addEventListener("click", () => { if (!state.answered) { state.orderSelected.splice(i, 1); renderTiles(); refreshAnswer(); } });
          answerRow.appendChild(slot);
        }
      }
      function renderTiles() {
        tileRow.innerHTML = "";
        tiles.forEach(tile => {
          const used = state.orderSelected.some(t => t.idx === tile.idx);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tile-btn";
          btn.textContent = tile.label;
          btn.disabled = used || state.answered;
          if (used) btn.classList.add("selected");
          btn.addEventListener("click", () => {
            if (state.answered || state.orderSelected.length >= q.answer.length) return;
            state.orderSelected.push(tile);
            renderTiles();
            refreshAnswer();
          });
          tileRow.appendChild(btn);
        });
      }
      refreshAnswer();
      renderTiles();
      board.appendChild(answerRow);
      board.appendChild(tileRow);
      const reset = document.createElement("button");
      reset.type = "button";
      reset.className = "secondary";
      reset.textContent = "Clear order";
      reset.addEventListener("click", () => { if (!state.answered) { state.orderSelected = []; renderTiles(); refreshAnswer(); } });
      board.appendChild(reset);
      els.interactionWrap.appendChild(board);
      els.checkBtn.classList.remove("hidden");
      els.checkBtn.onclick = () => submitAnswer(state.orderSelected.map(t => t.label));
    }

    function renderMatch(q) {
      const card = document.createElement("div");
      card.className = "match-card";
      const options = q.options || unique(q.pairs.map(p => p.right));
      card.innerHTML = `<table><thead><tr><th>Item</th><th>Match</th></tr></thead><tbody>${q.pairs.map((p,i) => `<tr><td>${escapeHtml(p.left)}</td><td><select data-left="${escapeHtml(p.left)}"><option value="">Choose…</option>${options.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>`;
      els.interactionWrap.appendChild(card);
      els.checkBtn.classList.remove("hidden");
      els.checkBtn.onclick = () => {
        const ans = {};
        card.querySelectorAll("select").forEach(sel => ans[sel.dataset.left] = sel.value);
        submitAnswer(ans);
      };
    }

    function correctFor(q, value) {
      if (q.kind === "multi") {
        const a = q.answer.map(key).sort().join("|");
        const v = Array.isArray(value) ? value.map(key).sort().join("|") : "";
        return a === v;
      }
      if (q.kind === "order") {
        if (!Array.isArray(value) || value.length !== q.answer.length) return false;
        return value.map(key).join("|") === q.answer.map(key).join("|");
      }
      if (q.kind === "match") {
        return Object.keys(q.answer).every(k => key(value[k] || "") === key(q.answer[k]));
      }
      return key(value) === key(q.answer);
    }

    function submitAnswer(value) {
      if (state.answered) return;
      const q = state.currentQuestion;
      const ok = correctFor(q, value);
      state.answered = true;
      state.index += 1;
      if (ok) state.score += 1;
      applyProgress(q.topic, ok);
      markInteraction(q, value, ok);
      showFeedback(ok, value);
      state.history.push({ topic: q.topic, title: q.title, prompt: q.prompt, correct: ok, given: fmtAnswer(value), answer: fmtAnswer(q.answer), explanation: q.explanation });
      els.nextBtn.classList.remove("hidden");
      els.checkBtn.classList.add("hidden");
      els.hintBtn.disabled = true;
      els.progressFill.style.width = `${(state.index / state.length) * 100}%`;
      els.scoreText.textContent = `Score ${state.score}`;
      els.questionCountText.textContent = `Question ${Math.min(state.index + 1, state.length)} of ${state.length}`;
      saveProgress();
    }

    function markInteraction(q, value, ok) {
      if (q.kind === "mc") {
        els.interactionWrap.querySelectorAll(".choice-btn").forEach(btn => {
          btn.disabled = true;
          if (key(btn.dataset.value) === key(q.answer)) btn.classList.add("correct");
          else if (key(btn.dataset.value) === key(value)) btn.classList.add("wrong");
        });
      }
      if (q.kind === "multi") {
        const answers = new Set(q.answer.map(key));
        const selected = new Set((Array.isArray(value) ? value : []).map(key));
        els.interactionWrap.querySelectorAll(".multi-btn").forEach(btn => {
          btn.disabled = true;
          const k = key(btn.dataset.value);
          if (answers.has(k)) btn.classList.add("correct");
          else if (selected.has(k)) btn.classList.add("wrong");
        });
      }
      if (q.kind === "order") {
        els.interactionWrap.querySelectorAll("button").forEach(btn => btn.disabled = true);
      }
      if (q.kind === "match") {
        els.interactionWrap.querySelectorAll("select").forEach(sel => { sel.disabled = true; sel.style.borderColor = key(sel.value) === key(q.answer[sel.dataset.left]) ? "#16803a" : "#c83232"; });
      }
    }

    function applyProgress(topic, ok) {
      const p = progress.topics[topic];
      p.total += 1;
      progress.lifetime.total += 1;
      if (ok) {
        p.correct += 1;
        progress.lifetime.correct += 1;
        p.streak += 1;
        p.bestStreak = Math.max(p.bestStreak, p.streak);
        if (p.streak >= 2) { p.level = clamp(p.level + 1, 1, 5); p.streak = 0; }
      } else {
        p.streak = 0;
        p.level = clamp(p.level - 1, 1, 5);
      }
    }

    function showFeedback(ok, value) {
      const q = state.currentQuestion;
      const chosen = fmtAnswer(value || "No answer selected");
      const correct = fmtAnswer(q.answer);
      const why = q.wrongTip || q.explanation || "Check the relationship, pattern or clue carefully before choosing.";
      els.feedbackPanel.className = `feedback-panel ${ok ? "good" : "bad"}`;
      els.feedbackPanel.innerHTML = ok
        ? `<strong>Correct!</strong><span>${escapeHtml(q.explanation)}</span>`
        : `<strong>Not quite.</strong><span>Your answer: <strong>${escapeHtml(chosen)}</strong></span><span>Correct answer: <strong>${escapeHtml(correct)}</strong></span><span>Why: ${escapeHtml(why)}</span>`;
      els.feedbackPanel.classList.remove("hidden");
    }

    function showHint() {
      if (state.answered || !state.currentQuestion) return;
      els.feedbackPanel.className = "feedback-panel hint";
      els.feedbackPanel.innerHTML = `<strong>Hint</strong>${escapeHtml(state.currentQuestion.hint)}`;
      els.feedbackPanel.classList.remove("hidden");
    }

    function showResults() {
      els.quizScreen.classList.add("hidden");
      els.resultsScreen.classList.remove("hidden");
      els.finalScore.textContent = `${state.score}/${state.length}`;
      const pct = Math.round(100 * state.score / state.length);
      els.finalMessage.textContent = pct >= 85 ? "Excellent verbal reasoning!" : pct >= 65 ? "Good progress — keep practising the tricky topics." : "Keep going — review the feedback and try another round.";
      const rows = state.history.map((h, i) => `<tr><td>${i+1}</td><td>${escapeHtml(TOPICS[h.topic].name)}</td><td>${escapeHtml(h.title)}</td><td>${h.correct ? "✅" : "❌"}</td><td>${escapeHtml(h.given)}</td><td>${escapeHtml(h.answer)}</td><td>${escapeHtml(h.explanation)}</td></tr>`).join("");
      els.reviewWrap.innerHTML = `<table class="review-table"><thead><tr><th>#</th><th>Topic</th><th>Type</th><th>Result</th><th>Your answer</th><th>Correct answer</th><th>Feedback</th></tr></thead><tbody>${rows}</tbody></table>`;
      renderHomeCardsOnly();
    }

    function renderHomeCardsOnly() {
      els.bankSummary.textContent = `${BANK.length}+ dynamic verbal reasoning variants loaded`;
    }

    els.hintBtn.addEventListener("click", showHint);
    els.nextBtn.addEventListener("click", nextQuestion);
    els.backBtn.addEventListener("click", renderHome);
    els.homeBtn.addEventListener("click", renderHome);
    els.playAgainBtn.addEventListener("click", () => startRound(state.topic || "mixed"));
    els.resetProgressBtn.addEventListener("click", () => {
      if (confirm("Reset all verbal reasoning progress?")) {
        progress = defaultProgress();
        saveProgress();
        renderHome();
      }
    });

    buildBank();
    extendBankWithFurtherVR500();
    const beforeAdditionalVR500 = BANK.length;
    extendBankWithAdditionalVR500();
    const additionalVRPool = BANK.splice(beforeAdditionalVR500);
    const additionalVRQuotas = { vocab: 65, analogies: 65, classification: 60, compounds: 55, codes: 80, sequences: 65, wordplay: 55, logic: 55 };
    const additionalVRKept = [];
    Object.keys(additionalVRQuotas).forEach(topic => {
      additionalVRKept.push(...additionalVRPool.filter(entry => entry.topic === topic).slice(0, additionalVRQuotas[topic]));
    });
    if (additionalVRKept.length < 500) {
      const usedIds = new Set(additionalVRKept.map(entry => entry.id));
      additionalVRKept.push(...additionalVRPool.filter(entry => !usedIds.has(entry.id)).slice(0, 500 - additionalVRKept.length));
    }
    BANK.push(...shuffle(additionalVRKept).slice(0, 500));
    extendBankWithFinalVR500();
    els.bankSummary.textContent = `${BANK.length}+ dynamic verbal reasoning variants loaded`;
    renderHome();
  </script>
</body>
</html>
